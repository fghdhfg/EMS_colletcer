name: collect-er-beds

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 (GitHub 부하 시 지연·생략될 수 있음 — 정상)
  workflow_dispatch: {}       # Actions 탭 수동 실행 버튼

permissions:
  contents: write             # 수집 결과를 저장소에 커밋하기 위한 권한

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests        # 핵심 수집은 requests만 있으면 됨

      - name: 가용병상 수집
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: python collect_beds.py

      # ── 부가: 포화 프로파일 재생성 (실패해도 수집은 계속됨) ──
      - name: 포화 프로파일 재생성
        continue-on-error: true          # 이 단계가 실패해도 워크플로 전체는 성공 처리
        run: |
          if [ -f build_saturation_profile.py ]; then
            pip install pandas
            python build_saturation_profile.py data
          else
            echo "build_saturation_profile.py 없음 → 프로파일 생성 스킵 (수집은 정상)"
          fi

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "er-bed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC 수집"
          git pull --rebase origin main
          git push
